<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 • Feature Unavailable</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#ffffff;
            --surface:#f7f7f7;
            --text:#111111;
            --muted:#666666;
            --border:#dddddd;
            --accent:#000000;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background:var(--bg);
            color:var(--text);
            line-height:1.7;
            min-height:100vh;
            display:flex;
            align-items:center;
        }

        .container{
            width:min(900px,90%);
            margin:auto;
        }

        .card{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:16px;
            padding:48px;
        }

        .hero-label{
            text-transform:uppercase;
            letter-spacing:.18em;
            color:var(--muted);
            font-size:.75rem;
            margin-bottom:12px;
        }

        h1{
            font-size:3rem;
            font-weight:700;
            margin-bottom:18px;
        }

        p{
            color:var(--muted);
            font-size:1.05rem;
            max-width:650px;
        }

        .cta{
            display:inline-flex;
            align-items:center;
            justify-content:center;

            text-decoration:none;

            background:#000;
            color:#fff;

            padding:16px 24px;
            margin-top:32px;

            border:1px solid #000;
            border-radius:12px;

            font-weight:600;
            transition:
                background .2s,
                transform .2s,
                border-color .2s;
        }

        .cta:hover{
            background:#222;
            border-color:#222;
            transform:translateY(-2px);
        }

        @media (max-width:700px){
            h1{
                font-size:2.2rem;
            }

            .card{
                padding:32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="hero-label">404</div>

            <h1>Feature Unavailable</h1>

            <p>
                Sorry, this feature is not available yet or has been removed.
                We're still working on some parts of the platform, so check back
                later for updates.
            </p>

            <a href="/" class="cta">Return Home</a>
        </div>
    </div>

</body>
</html>
